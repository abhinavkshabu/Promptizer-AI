<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            color-scheme: light;
            --ink: #151612;
            --paper: #f7f1e6;
            --surface: #fffaf0;
            --line: #d8cdb9;
            --muted: #756f62;
            --accent: #f59f00;
            --teal: #0f766e;
            --focus: rgba(15, 118, 110, 0.22);
        }

        * {
            box-sizing: border-box;
        }

        body {
            width: 328px;
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .popup-shell {
            padding: 16px;
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 11px;
            margin-bottom: 16px;
        }

        .brand-mark {
            display: grid;
            width: 44px;
            height: 44px;
            flex: 0 0 auto;
            place-items: center;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            box-shadow: 0 10px 24px rgba(21, 22, 18, 0.1);
        }

        .brand-mark img {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 850;
            line-height: 1.05;
            letter-spacing: 0;
        }

        .subtitle {
            margin-top: 4px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 650;
            line-height: 1.25;
        }

        .section-label {
            display: block;
            margin: 0 0 7px 2px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 750;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .mode-list {
            display: grid;
            gap: 9px;
        }

        .mode-btn {
            display: flex;
            width: 100%;
            min-height: 54px;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            color: var(--ink);
            cursor: pointer;
            font: inherit;
            padding: 0 12px 0 14px;
            text-align: left;
            transition: border-color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
        }

        .mode-btn:hover {
            border-color: #b8a98f;
            background: #fffdf8;
            transform: translateY(-1px);
        }

        .mode-btn:focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 2px;
        }

        .mode-btn.is-active {
            border-color: var(--teal);
            background: #e4f5f0;
            box-shadow: 0 0 0 1px rgba(15, 118, 110, 0.18) inset;
        }

        .mode-title {
            font-size: 14px;
            font-weight: 850;
            line-height: 1;
        }

        .mode-desc {
            margin-top: 3px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 500;
            line-height: 1.2;
        }

        .mode-check {
            display: grid;
            width: 24px;
            height: 24px;
            flex: 0 0 auto;
            place-items: center;
            border: 1px solid #c8bda8;
            border-radius: 999px;
            color: transparent;
        }

        .mode-btn.is-active .mode-check {
            border-color: var(--teal);
            background: var(--teal);
            color: #fff;
        }

        .mode-check svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 2.4;
        }

        /* ── Persona chips ── */
        .divider {
            height: 1px;
            margin: 14px 0;
            border: none;
            background: var(--line);
        }

        .persona-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .persona-chip {
            display: inline-flex;
            align-items: center;
            height: 30px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--surface);
            color: var(--ink);
            cursor: pointer;
            font: inherit;
            font-size: 12px;
            font-weight: 650;
            transition: border-color 0.16s ease, background 0.16s ease, transform 0.14s ease;
        }

        .persona-chip:hover {
            border-color: #b8a98f;
            background: #fffdf8;
            transform: translateY(-1px);
        }

        .persona-chip.is-active {
            border-color: var(--teal);
            background: #e4f5f0;
            color: var(--teal);
        }

        .status {
            min-height: 16px;
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 11px;
            font-weight: 650;
            line-height: 1.4;
            text-align: center;
        }

        .version {
            margin: 10px 0 0;
            color: #b5a998;
            font-size: 10px;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>

<body>
    <main class="popup-shell">
        <header class="topbar">
            <div class="brand-mark" aria-hidden="true">
                <img src="icons/icon48.png" alt="">
            </div>
            <div>
                <h1>Promptizer</h1>
                <div class="subtitle">AI prompt optimizer</div>
            </div>
        </header>

        <span class="section-label">Mode</span>
        <section class="mode-list" role="radiogroup" aria-label="Prompting framework">
            <button class="mode-btn" type="button" data-framework="general" role="radio" aria-checked="false">
                <div>
                    <span class="mode-title">General</span>
                    <div class="mode-desc">Balanced optimization for any task</div>
                </div>
                <span class="mode-check" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 6 9 17l-5-5"></path>
                    </svg>
                </span>
            </button>
            <button class="mode-btn" type="button" data-framework="coding" role="radio" aria-checked="false">
                <div>
                    <span class="mode-title">Technical</span>
                    <div class="mode-desc">Code, DevOps & data science</div>
                </div>
                <span class="mode-check" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 6 9 17l-5-5"></path>
                    </svg>
                </span>
            </button>
            <button class="mode-btn" type="button" data-framework="creative" role="radio" aria-checked="false">
                <div>
                    <span class="mode-title">Creative</span>
                    <div class="mode-desc">Writing, images, video & audio</div>
                </div>
                <span class="mode-check" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 6 9 17l-5-5"></path>
                    </svg>
                </span>
            </button>
        </section>

        <hr class="divider">

        <span class="section-label">Response Style</span>
        <div class="persona-row" role="radiogroup" aria-label="Response persona">
            <button class="persona-chip" type="button" data-persona="expert" role="radio" aria-checked="false">Expert</button>
            <button class="persona-chip" type="button" data-persona="concise" role="radio" aria-checked="false">Concise</button>
            <button class="persona-chip" type="button" data-persona="teacher" role="radio" aria-checked="false">Teacher</button>
            <button class="persona-chip" type="button" data-persona="peer" role="radio" aria-checked="false">Peer</button>
        </div>

        <p class="status" id="statusText" role="status" aria-live="polite"></p>
        <p class="version">v1.0.0</p>
    </main>

    <script src="popup.js"></script>
</body>

</html>
